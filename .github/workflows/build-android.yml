name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Initialize Android Project
        run: npx tauri android init

      - name: Setup signing key
        run: |
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/ytz.keystore" -alias ytz -keyalg RSA -keysize 2048 -validity 10000 -storepass ytz123456 -keypass ytz123456 -dname "CN=YT-Z, O=YT-Z, C=IN"
          printf 'storePassword=ytz123456\nkeyPassword=ytz123456\nkeyAlias=ytz\nstoreFile=%s/ytz.keystore\n' "$GITHUB_WORKSPACE" > src-tauri/gen/android/keystore.properties

      - name: Build Android Release APK (arm64 only)
        run: npx tauri android build --apk --target aarch64
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Sign APK if unsigned
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n1)
          if ! "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks "$GITHUB_WORKSPACE/ytz.keystore" --ks-pass pass:ytz123456 --ks-key-alias ytz --key-pass pass:ytz123456 "$APK"
            echo "APK signed manually"
          else
            echo "APK already signed by Gradle"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Z-Android-Release-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
