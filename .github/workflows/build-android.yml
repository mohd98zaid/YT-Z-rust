name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Yahan humne saare zaroori Android packages add kar diye hain
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Initialize Android Project
        run: npx tauri android init

      - name: Build Android Debug APK
        run: npx tauri android build --debug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          # Rust ko batana padega ki NDK kahan hai
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Z-Android-Debug-APK
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
